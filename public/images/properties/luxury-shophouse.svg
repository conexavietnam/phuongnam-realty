<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="shSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F243E" />
      <stop offset="60%" stop-color="#244B7A" />
      <stop offset="100%" stop-color="#F2AF58" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#shSky)" />

  <!-- Commercial Shophouses Street Block -->
  <g transform="translate(140, 160)">
    <!-- Main Shophouse Building -->
    <rect x="0" y="0" width="520" height="300" fill="#2E3846" rx="4" />
    <!-- Classical Cornice -->
    <rect x="-10" y="-10" width="540" height="12" fill="#D49B42" rx="2" />

    <!-- 3rd Floor Windows -->
    <g fill="#FFE59E" opacity="0.8">
      <rect x="30" y="25" width="40" height="50" rx="3" />
      <rect x="95" y="25" width="40" height="50" rx="3" />
      <rect x="160" y="25" width="40" height="50" rx="3" />
      <rect x="235" y="25" width="50" height="50" rx="3" />
      <rect x="320" y="25" width="40" height="50" rx="3" />
      <rect x="385" y="25" width="40" height="50" rx="3" />
      <rect x="450" y="25" width="40" height="50" rx="3" />
    </g>

    <!-- 2nd Floor Balcony with French Doors -->
    <g fill="#FFE59E" opacity="0.9">
      <rect x="30" y="100" width="40" height="65" rx="3" />
      <rect x="95" y="100" width="40" height="65" rx="3" />
      <rect x="160" y="100" width="40" height="65" rx="3" />
      <rect x="320" y="100" width="40" height="65" rx="3" />
      <rect x="385" y="100" width="40" height="65" rx="3" />
      <rect x="450" y="100" width="40" height="65" rx="3" />
    </g>
    <!-- Balcony Railing -->
    <line x1="20" y1="165" x2="500" y2="165" stroke="#D49B42" stroke-width="3" />

    <!-- Ground Floor Boutique Storefronts (Cafe & Retail) -->
    <!-- Store 1: Boutique Cafe -->
    <rect x="20" y="195" width="220" height="105" fill="#FFE8A3" rx="2" />
    <rect x="35" y="210" width="60" height="90" fill="#0A192F" rx="2" />
    <rect x="110" y="210" width="115" height="90" fill="#0A192F" rx="2" />
    <!-- Cafe Sign -->
    <rect x="35" y="185" width="190" height="18" fill="#0A192F" rx="2" />
    <text x="130" y="198" fill="#FFE8A3" font-size="9" font-family="Inter, sans-serif" font-weight="700" text-anchor="middle">BOUTIQUE CAFE</text>

    <!-- Store 2: Luxury Brand Retail -->
    <rect x="280" y="195" width="220" height="105" fill="#FFE8A3" rx="2" />
    <rect x="295" y="210" width="115" height="90" fill="#0A192F" rx="2" />
    <rect x="425" y="210" width="60" height="90" fill="#0A192F" rx="2" />
    <!-- Retail Sign -->
    <rect x="295" y="185" width="190" height="18" fill="#0A192F" rx="2" />
    <text x="390" y="198" fill="#FFE8A3" font-size="9" font-family="Inter, sans-serif" font-weight="700" text-anchor="middle">GALLERY & LIVING</text>
  </g>

  <!-- Paved Pedestrian Promenade with Warm Fairy Light Festoons -->
  <polygon points="0,460 800,460 800,600 0,600" fill="#1E293B" />
  <g fill="#FFE59E">
    <circle cx="200" cy="455" r="3" />
    <circle cx="240" cy="450" r="3" />
    <circle cx="280" cy="455" r="3" />
    <circle cx="320" cy="450" r="3" />
    <circle cx="500" cy="455" r="3" />
    <circle cx="540" cy="450" r="3" />
    <circle cx="580" cy="455" r="3" />
    <circle cx="620" cy="450" r="3" />
  </g>

  <!-- Badge -->
  <rect x="30" y="30" width="180" height="28" rx="6" fill="#0A192F" fill-opacity="0.85" stroke="#D49B42" stroke-width="1.5" />
  <text x="120" y="49" fill="#FFE8A3" font-size="12" font-family="Inter, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="1">SHOPHOUSE THƯƠNG MẠI</text>
</svg>
