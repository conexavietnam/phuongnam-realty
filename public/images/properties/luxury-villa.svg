<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lvSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1D31" />
      <stop offset="50%" stop-color="#1B385C" />
      <stop offset="85%" stop-color="#DE8C3B" />
      <stop offset="100%" stop-color="#FFD494" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#lvSky)" />

  <!-- Architectural Contemporary Villa -->
  <g transform="translate(180, 160)">
    <!-- 2nd Floor Floating Cantilever Box -->
    <rect x="40" y="30" width="380" height="150" fill="#FFFFFF" rx="4" stroke="#E2E8F0" stroke-width="2" />
    <!-- Teak Wood Louvers -->
    <rect x="40" y="30" width="120" height="150" fill="#8C5C35" rx="2" />
    <!-- Master Bedroom Glass Wall -->
    <rect x="175" y="45" width="220" height="115" rx="2" fill="#FFE59E" opacity="0.85" />
    <line x1="285" y1="45" x2="285" y2="160" stroke="#1A202C" stroke-width="3" />

    <!-- 1st Floor Living Pavilion -->
    <rect x="0" y="180" width="460" height="160" fill="#1A202C" rx="4" />
    <!-- Glass Sliders with Warm Interior Chandelier Light -->
    <rect x="25" y="195" width="410" height="135" fill="#FFE8A3" opacity="0.9" rx="2" />
    <line x1="120" y1="195" x2="120" y2="330" stroke="#0A192F" stroke-width="4" />
    <line x1="230" y1="195" x2="230" y2="330" stroke="#0A192F" stroke-width="4" />
    <line x1="340" y1="195" x2="340" y2="330" stroke="#0A192F" stroke-width="4" />
  </g>

  <!-- Villa Infinity Pool & Garden Terrace -->
  <polygon points="0,480 800,480 800,600 0,600" fill="#1C3857" />
  <!-- Pool Basin -->
  <polygon points="120,490 680,490 710,580 90,580" fill="#36CFC9" />
  <rect x="110" y="488" width="580" height="4" fill="#BAE7FF" />

  <!-- Tropical Palms -->
  <g fill="#1B4332">
    <ellipse cx="100" cy="400" rx="45" ry="60" />
    <ellipse cx="690" cy="390" rx="55" ry="70" />
  </g>

  <!-- Badge -->
  <rect x="30" y="30" width="180" height="28" rx="6" fill="#0A192F" fill-opacity="0.85" stroke="#D49B42" stroke-width="1.5" />
  <text x="120" y="49" fill="#FFE8A3" font-size="12" font-family="Inter, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="1">BIỆT THỰ THƯỢNG LƯU</text>
</svg>
