<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="aqSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E2D52" />
      <stop offset="60%" stop-color="#215B8C" />
      <stop offset="90%" stop-color="#D49B42" />
      <stop offset="100%" stop-color="#FFE8A3" />
    </linearGradient>
    <linearGradient id="aqWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144670" />
      <stop offset="60%" stop-color="#0A253D" />
      <stop offset="100%" stop-color="#051421" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#aqSky)" />

  <!-- Italian Clock Tower & Piazza (Aqua Marina) -->
  <g transform="translate(180, 160)">
    <!-- Tower Body -->
    <rect x="50" y="20" width="60" height="280" fill="#E8D8C3" stroke="#C9B497" stroke-width="2" />
    <!-- Clock Tower Crown -->
    <polygon points="40,20 80,-40 120,20" fill="#B34728" />
    <!-- Clock Dial -->
    <circle cx="80" cy="60" r="18" fill="#FFFFFF" stroke="#0A192F" stroke-width="2" />
    <line x1="80" y1="60" x2="80" y2="48" stroke="#0A192F" stroke-width="2" />
    <line x1="80" y1="60" x2="90" y2="60" stroke="#0A192F" stroke-width="2" />
    <!-- Classical Windows -->
    <rect x="70" y="110" width="20" height="35" rx="3" fill="#142B47" />
    <rect x="70" y="170" width="20" height="35" rx="3" fill="#142B47" />
    <rect x="70" y="230" width="20" height="35" rx="3" fill="#142B47" />
  </g>

  <!-- Mediterranean Piazza Buildings -->
  <rect x="290" y="240" width="240" height="180" fill="#F4ECE1" stroke="#D5C7B5" stroke-width="2" />
  <!-- Terracotta Tile Roof -->
  <polygon points="270,240 410,190 550,240" fill="#C95B32" />
  <!-- Arched Portico Arcade -->
  <g fill="#0A192F">
    <path d="M310 360 A 15 15 0 0 1 340 360 L 340 420 L 310 420 Z" />
    <path d="M360 360 A 15 15 0 0 1 390 360 L 390 420 L 360 420 Z" />
    <path d="M410 360 A 15 15 0 0 1 440 360 L 440 420 L 410 420 Z" />
    <path d="M460 360 A 15 15 0 0 1 490 360 L 490 420 L 460 420 Z" />
  </g>

  <!-- Marina Pier & Pontoon -->
  <polygon points="0,420 800,420 800,450 0,450" fill="#3D2E24" />
  <rect x="0" y="440" width="800" height="160" fill="url(#aqWater)" />

  <!-- Luxury Yachts at Marina Dock -->
  <!-- Yacht 1 -->
  <g transform="translate(180, 430)">
    <polygon points="0,35 140,35 170,12 25,12" fill="#FFFFFF" />
    <polygon points="35,12 55,-8 115,-8 125,12" fill="#0A192F" />
    <rect x="65" y="-4" width="45" height="8" rx="2" fill="#69C0FF" />
    <line x1="85" y1="-8" x2="85" y2="-28" stroke="#FFE8A3" stroke-width="2" />
  </g>

  <!-- Yacht 2 -->
  <g transform="translate(480, 445) scale(0.9)">
    <polygon points="0,35 150,35 180,10 30,10" fill="#FFFFFF" />
    <polygon points="40,10 65,-12 130,-12 140,10" fill="#0A192F" />
    <rect x="75" y="-8" width="50" height="9" rx="2" fill="#FFE59E" />
    <line x1="95" y1="-12" x2="95" y2="-32" stroke="#FFE8A3" stroke-width="2" />
  </g>

  <!-- Water Reflections -->
  <g stroke="#FFE8A3" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
    <line x1="220" y1="495" x2="360" y2="495" />
    <line x1="520" y1="510" x2="680" y2="510" />
    <line x1="300" y1="550" x2="550" y2="550" stroke-width="2" />
  </g>

  <!-- Badge -->
  <rect x="30" y="30" width="130" height="28" rx="6" fill="#0A192F" fill-opacity="0.85" stroke="#40A9FF" stroke-width="1.5" />
  <text x="95" y="49" fill="#BAE7FF" font-size="12" font-family="Inter, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="1">AQUA CITY</text>
</svg>
