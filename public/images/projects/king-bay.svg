<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="kbSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E2338" />
      <stop offset="60%" stop-color="#1E4770" />
      <stop offset="100%" stop-color="#D49B42" />
    </linearGradient>
    <linearGradient id="kbRiver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#143E63" />
      <stop offset="100%" stop-color="#061829" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#kbSky)" />

  <!-- Peninsular Island Estate (3 Sides River Frontage) -->
  <polygon points="100,420 700,420 760,510 40,510" fill="#1E4620" />

  <!-- Luxury Mediterranean Villa Estate -->
  <g transform="translate(240, 210)">
    <!-- Villa Body -->
    <rect x="0" y="50" width="320" height="160" fill="#FFFBF5" stroke="#E2D7C5" stroke-width="2" rx="3" />
    <!-- Classical Spanish Tile Roof -->
    <polygon points="-20,50 160,-10 340,50" fill="#C04A26" />
    <!-- Arched Portico Windows -->
    <g fill="#0E2338">
      <path d="M40 100 A 20 20 0 0 1 80 100 L 80 150 L 40 150 Z" />
      <path d="M140 90 A 25 25 0 0 1 190 90 L 190 150 L 140 150 Z" />
      <path d="M250 100 A 20 20 0 0 1 290 100 L 290 150 L 250 150 Z" />
    </g>
    <!-- Warm Ambient Window Lights -->
    <rect x="48" y="110" width="24" height="35" fill="#FFE59E" rx="2" />
    <rect x="150" y="100" width="30" height="45" fill="#FFE59E" rx="2" />
    <rect x="258" y="110" width="24" height="35" fill="#FFE59E" rx="2" />
    <!-- Ground Floor Grand Double Doors -->
    <rect x="145" y="160" width="40" height="50" fill="#8C5C35" rx="2" />
  </g>

  <!-- Private Villa Infinity Pool on Peninsula Tip -->
  <polygon points="260,390 540,390 560,430 240,430" fill="#36CFC9" />
  <rect x="238" y="388" width="324" height="4" fill="#E6FFFB" />

  <!-- Private Yacht Dock -->
  <rect x="360" y="470" width="80" height="50" fill="#8C5C35" />
  <!-- Moored Motor Yacht -->
  <g transform="translate(370, 500)">
    <polygon points="0,20 90,20 110,5 15,5" fill="#FFFFFF" />
    <polygon points="25,5 40,-8 80,-8 90,5" fill="#0A192F" />
    <circle cx="50" cy="-2" r="3" fill="#69C0FF" />
  </g>

  <!-- Dong Nai River Wrapping Around the Estate -->
  <rect x="0" y="510" width="800" height="90" fill="url(#kbRiver)" />
  <line x1="80" y1="535" x2="320" y2="535" stroke="#FFE8A3" stroke-width="2" opacity="0.6" stroke-linecap="round" />
  <line x1="480" y1="545" x2="720" y2="545" stroke="#FFE8A3" stroke-width="2" opacity="0.6" stroke-linecap="round" />

  <!-- Badge -->
  <rect x="30" y="30" width="120" height="28" rx="6" fill="#0A192F" fill-opacity="0.85" stroke="#D49B42" stroke-width="1.5" />
  <text x="90" y="49" fill="#FFE8A3" font-size="12" font-family="Inter, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="1">KING BAY</text>
</svg>
