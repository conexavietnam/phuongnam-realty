<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="intBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#232B3A" />
    </linearGradient>
    <linearGradient id="windowView" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09182B" />
      <stop offset="60%" stop-color="#2A4B74" />
      <stop offset="90%" stop-color="#D49B42" />
      <stop offset="100%" stop-color="#FFE8A3" />
    </linearGradient>
    <linearGradient id="sofaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8E2D8" />
      <stop offset="100%" stop-color="#C2B8A8" />
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="100%" stop-color="#D49B42" />
    </linearGradient>
  </defs>

  <!-- Room Interior Canvas -->
  <rect width="800" height="600" fill="url(#intBg)" />

  <!-- Hardwood Parquet Floor with Perspective -->
  <polygon points="0,420 800,420 800,600 0,600" fill="#3D2E24" />
  <g stroke="#2B2019" stroke-width="1.5" opacity="0.6">
    <line x1="200" y1="420" x2="100" y2="600" />
    <line x1="400" y1="420" x2="350" y2="600" />
    <line x1="600" y1="420" x2="650" y2="600" />
  </g>

  <!-- Large Floor-to-Ceiling Panoramic Glass Wall -->
  <rect x="80" y="40" width="640" height="380" fill="url(#windowView)" rx="6" />

  <!-- River and Distant City Outside the Window -->
  <rect x="80" y="300" width="640" height="120" fill="#0C2034" />
  <g fill="#071321" opacity="0.8">
    <rect x="180" y="240" width="40" height="70" />
    <polygon points="180,240 200,210 220,240" />
    <rect x="260" y="220" width="50" height="90" />
    <rect x="420" y="190" width="60" height="120" />
    <polygon points="450,150 451,190 449,190" stroke="#FFE8A3" stroke-width="2" />
    <rect x="520" y="230" width="45" height="80" />
  </g>
  <!-- Window Glass Frame Mullions -->
  <line x1="290" y1="40" x2="290" y2="420" stroke="#121820" stroke-width="6" />
  <line x1="510" y1="40" x2="510" y2="420" stroke="#121820" stroke-width="6" />
  <line x1="80" y1="260" x2="720" y2="260" stroke="#121820" stroke-width="4" />
  <!-- Glass Sheen Glare -->
  <polygon points="120,40 180,40 100,420 40,420" fill="#FFFFFF" opacity="0.06" />

  <!-- Luxury L-Shaped Sectional Sofa -->
  <g>
    <!-- Base -->
    <rect x="180" y="440" width="420" height="90" rx="16" fill="url(#sofaGrad)" />
    <!-- Sofa Backrest -->
    <rect x="180" y="390" width="320" height="60" rx="12" fill="#D7CFBE" />
    <rect x="500" y="410" width="100" height="110" rx="12" fill="#D7CFBE" />
    <!-- Cushions with Gold piping -->
    <rect x="200" y="405" width="80" height="40" rx="6" fill="#F0EBE1" stroke="url(#goldAcc)" stroke-width="1.5" />
    <rect x="290" y="405" width="80" height="40" rx="6" fill="#F0EBE1" stroke="url(#goldAcc)" stroke-width="1.5" />
    <rect x="380" y="405" width="80" height="40" rx="6" fill="#D49B42" opacity="0.9" />
  </g>

  <!-- Modern Marble Coffee Table -->
  <g>
    <ellipse cx="380" cy="540" rx="100" ry="35" fill="#EAEAEA" stroke="url(#goldAcc)" stroke-width="3" />
    <ellipse cx="380" cy="540" rx="85" ry="28" fill="#F7F7F7" />
    <!-- Table vase with dried pampas grass -->
    <ellipse cx="360" cy="535" rx="12" ry="8" fill="#0A192F" />
    <line x1="360" y1="535" x2="355" y2="490" stroke="#D49B42" stroke-width="2" />
    <circle cx="355" cy="488" r="5" fill="#FFE8A3" />
    <line x1="360" y1="535" x2="370" y2="495" stroke="#D49B42" stroke-width="1.5" />
    <circle cx="370" cy="493" r="4" fill="#FFE8A3" />
  </g>

  <!-- Designer Chandelier / Pendant Light -->
  <g>
    <line x1="400" y1="0" x2="400" y2="90" stroke="url(#goldAcc)" stroke-width="3" />
    <!-- Geometric ring lamp -->
    <circle cx="400" cy="110" r="30" stroke="url(#goldAcc)" stroke-width="4" fill="none" />
    <circle cx="400" cy="110" r="10" fill="#FFE8A3" />
    <!-- Ambient Light Cone -->
    <polygon points="400,110 240,460 560,460" fill="#FFE8A3" opacity="0.12" />
  </g>

  <!-- Badge -->
  <rect x="30" y="30" width="160" height="28" rx="6" fill="#0A192F" fill-opacity="0.85" stroke="#D49B42" stroke-width="1.5" />
  <text x="110" y="49" fill="#FFE8A3" font-size="12" font-family="Inter, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="1">NỘI THẤT CAO CẤP</text>
</svg>
