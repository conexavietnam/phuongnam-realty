<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="pcSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142B47" />
      <stop offset="60%" stop-color="#3D6A99" />
      <stop offset="100%" stop-color="#E8D5B5" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#pcSky)" />

  <!-- Modern Compound Luxury Townhouses Row -->
  <!-- Townhouse Unit 1 -->
  <g transform="translate(100, 200)">
    <rect x="0" y="0" width="180" height="240" fill="#FFFFFF" rx="2" stroke="#E2E8F0" stroke-width="2" />
    <rect x="15" y="-12" width="150" height="12" fill="#2D3748" rx="2" />
    <!-- 3rd Floor Cantilever Balcony -->
    <rect x="20" y="20" width="140" height="50" fill="#1A202C" rx="2" />
    <rect x="25" y="25" width="130" height="40" fill="#FFE59E" rx="2" opacity="0.8" />
    <!-- 2nd Floor Wood Louver Facade -->
    <rect x="20" y="90" width="70" height="60" fill="#9C6B3D" rx="2" />
    <rect x="100" y="90" width="60" height="60" fill="#1A202C" rx="2" />
    <rect x="105" y="95" width="50" height="50" fill="#69C0FF" rx="2" opacity="0.7" />
    <!-- 1st Floor Garage & Entry Door -->
    <rect x="20" y="165" width="100" height="75" fill="#4A5568" rx="2" />
    <rect x="130" y="165" width="30" height="75" fill="#805A3B" rx="2" />
  </g>

  <!-- Townhouse Unit 2 -->
  <g transform="translate(300, 200)">
    <rect x="0" y="0" width="180" height="240" fill="#F7FAFC" rx="2" stroke="#E2E8F0" stroke-width="2" />
    <rect x="15" y="-12" width="150" height="12" fill="#2D3748" rx="2" />
    <rect x="20" y="20" width="140" height="50" fill="#1A202C" rx="2" />
    <rect x="25" y="25" width="130" height="40" fill="#FFE59E" rx="2" opacity="0.8" />
    <rect x="20" y="90" width="60" height="60" fill="#1A202C" rx="2" />
    <rect x="25" y="95" width="50" height="50" fill="#69C0FF" rx="2" opacity="0.7" />
    <rect x="90" y="90" width="70" height="60" fill="#9C6B3D" rx="2" />
    <rect x="20" y="165" width="100" height="75" fill="#4A5568" rx="2" />
    <rect x="130" y="165" width="30" height="75" fill="#805A3B" rx="2" />
  </g>

  <!-- Townhouse Unit 3 -->
  <g transform="translate(500, 200)">
    <rect x="0" y="0" width="180" height="240" fill="#FFFFFF" rx="2" stroke="#E2E8F0" stroke-width="2" />
    <rect x="15" y="-12" width="150" height="12" fill="#2D3748" rx="2" />
    <rect x="20" y="20" width="140" height="50" fill="#1A202C" rx="2" />
    <rect x="25" y="25" width="130" height="40" fill="#FFE59E" rx="2" opacity="0.8" />
    <rect x="20" y="90" width="70" height="60" fill="#9C6B3D" rx="2" />
    <rect x="100" y="90" width="60" height="60" fill="#1A202C" rx="2" />
    <rect x="20" y="165" width="100" height="75" fill="#4A5568" rx="2" />
    <rect x="130" y="165" width="30" height="75" fill="#805A3B" rx="2" />
  </g>

  <!-- Paved Compound Street & Manicured Lawn -->
  <polygon points="0,440 800,440 800,600 0,600" fill="#2D3748" />
  <polygon points="0,440 800,440 800,465 0,465" fill="#38A169" />

  <!-- Street Trees & Flower Boxes -->
  <g fill="#276749">
    <ellipse cx="80" cy="420" rx="30" ry="40" />
    <ellipse cx="280" cy="420" rx="30" ry="40" />
    <ellipse cx="480" cy="420" rx="30" ry="40" />
    <ellipse cx="700" cy="420" rx="30" ry="40" />
  </g>

  <!-- Badge -->
  <rect x="30" y="30" width="130" height="28" rx="6" fill="#0A192F" fill-opacity="0.85" stroke="#D49B42" stroke-width="1.5" />
  <text x="95" y="49" fill="#FFE8A3" font-size="12" font-family="Inter, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="1">PALM CITY</text>
</svg>
