<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="prSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#081A30" />
      <stop offset="50%" stop-color="#183D69" />
      <stop offset="85%" stop-color="#E59846" />
      <stop offset="100%" stop-color="#FFD493" />
    </linearGradient>
    <linearGradient id="prTower1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#142B47" />
      <stop offset="40%" stop-color="#285E99" />
      <stop offset="100%" stop-color="#1A3B63" />
    </linearGradient>
    <linearGradient id="prWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E2D4A" />
      <stop offset="60%" stop-color="#07192C" />
      <stop offset="100%" stop-color="#030C17" />
    </linearGradient>
    <linearGradient id="prGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE08A" />
      <stop offset="100%" stop-color="#D49B42" />
    </linearGradient>
    <filter id="prGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#prSky)" />

  <!-- Sunset Sun Orb -->
  <circle cx="560" cy="330" r="60" fill="#FFE8A3" opacity="0.85" filter="url(#prGlow)" />
  <circle cx="560" cy="330" r="100" fill="#FFC069" opacity="0.3" filter="url(#prGlow)" />

  <!-- Distant City Silhouette -->
  <g fill="#0E2338" opacity="0.6">
    <rect x="20" y="340" width="40" height="120" />
    <rect x="70" y="320" width="55" height="140" />
    <rect x="135" y="350" width="35" height="110" />
    <rect x="620" y="330" width="50" height="130" />
    <rect x="680" y="310" width="70" height="150" />
    <polygon points="715,280 716,310 714,310" stroke="#FFE08A" stroke-width="2" />
  </g>

  <!-- Main Palm River Tower A -->
  <g>
    <path d="M190 120 Q280 100 370 120 L370 470 L190 470 Z" fill="url(#prTower1)" />
    <!-- Horizontal Balcony Ribbons -->
    <g stroke="url(#prGold)" stroke-width="2.5" fill="none">
      <path d="M185 150 Q280 135 375 150" />
      <path d="M185 185 Q280 170 375 185" />
      <path d="M185 220 Q280 205 375 220" />
      <path d="M185 255 Q280 240 375 255" />
      <path d="M185 290 Q280 275 375 290" />
      <path d="M185 325 Q280 310 375 325" />
      <path d="M185 360 Q280 345 375 360" />
      <path d="M185 395 Q280 380 375 395" />
      <path d="M185 430 Q280 415 375 430" />
    </g>
    <!-- Balcony Glass Reflection & Lights -->
    <g fill="#FFECA8" opacity="0.75">
      <rect x="210" y="160" width="35" height="15" rx="2" />
      <rect x="290" y="160" width="40" height="15" rx="2" />
      <rect x="230" y="230" width="45" height="15" rx="2" />
      <rect x="300" y="230" width="35" height="15" rx="2" />
      <rect x="215" y="300" width="50" height="15" rx="2" />
      <rect x="295" y="300" width="45" height="15" rx="2" />
      <rect x="220" y="370" width="45" height="15" rx="2" />
      <rect x="285" y="370" width="50" height="15" rx="2" />
    </g>
    <!-- Sky Penthouse Glass Crown -->
    <polygon points="230,120 280,75 330,120" fill="#2E6BA8" stroke="#FFE8A3" stroke-width="2" />
    <circle cx="280" cy="75" r="4" fill="#FFE8A3" filter="url(#prGlow)" />
  </g>

  <!-- Palm River Tower B (Rear/Side) -->
  <g>
    <path d="M380 180 Q450 165 520 180 L520 460 L380 460 Z" fill="#112946" />
    <g stroke="#D49B42" stroke-width="2" fill="none" opacity="0.8">
      <path d="M378 210 Q450 195 522 210" />
      <path d="M378 250 Q450 235 522 250" />
      <path d="M378 290 Q450 275 522 290" />
      <path d="M378 330 Q450 315 522 330" />
      <path d="M378 370 Q450 355 522 370" />
      <path d="M378 410 Q450 395 522 410" />
    </g>
  </g>

  <!-- Podium / Resort Infinity Pool Deck -->
  <g>
    <polygon points="120,440 560,420 580,480 110,480" fill="#1C3857" />
    <!-- Turquoise Infinity Pool -->
    <polygon points="160,448 480,436 490,465 150,465" fill="#36CFC9" filter="url(#prGlow)" opacity="0.85" />
    <polygon points="160,448 480,436 490,455 150,455" fill="#BAE7FF" opacity="0.6" />
  </g>

  <!-- Tropical Palms & Landscaping -->
  <g fill="#0A2218">
    <!-- Palm 1 -->
    <path d="M120 480 Q125 430 115 390 Q145 375 160 380 Q135 405 125 415 Q145 425 135 440 Z" />
    <path d="M115 390 Q90 380 75 390 Q100 405 110 410 Z" />
    <!-- Palm 2 -->
    <path d="M540 470 Q545 420 560 380 Q585 365 600 375 Q575 395 565 410 Q585 415 575 435 Z" />
    <path d="M560 380 Q535 370 520 385 Q545 395 550 405 Z" />
  </g>

  <!-- Saigon River Water Front -->
  <rect x="0" y="470" width="800" height="130" fill="url(#prWater)" />

  <!-- River Sunset Glow Reflection -->
  <ellipse cx="560" cy="510" rx="90" ry="25" fill="#FFC069" opacity="0.5" filter="url(#prGlow)" />
  <ellipse cx="280" cy="530" rx="60" ry="30" fill="#FFE08A" opacity="0.4" filter="url(#prGlow)" />

  <!-- Water Ripple Highlights -->
  <g stroke="#FFE8A3" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <line x1="220" y1="495" x2="340" y2="495" />
    <line x1="480" y1="505" x2="620" y2="505" stroke-width="2" />
    <line x1="180" y1="535" x2="380" y2="535" />
    <line x1="450" y1="545" x2="650" y2="545" stroke-width="2" />
    <line x1="260" y1="575" x2="520" y2="575" stroke-width="2.5" />
  </g>

  <!-- Floating Badge Watermark -->
  <rect x="30" y="30" width="130" height="28" rx="6" fill="#0A192F" fill-opacity="0.85" stroke="#D49B42" stroke-width="1.5" />
  <text x="95" y="49" fill="#FFE8A3" font-size="12" font-family="Inter, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="1">PALM RIVER</text>
</svg>
