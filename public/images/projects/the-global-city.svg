<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gcSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#081426" />
      <stop offset="60%" stop-color="#142B4D" />
      <stop offset="90%" stop-color="#C25A2B" />
      <stop offset="100%" stop-color="#FFB366" />
    </linearGradient>
    <linearGradient id="canalWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0C2C4D" />
      <stop offset="100%" stop-color="#041221" />
    </linearGradient>
    <linearGradient id="fountainLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#40A9FF" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#B5F5EC" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9" />
    </linearGradient>
    <filter id="fountainGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Twilight Sky -->
  <rect width="800" height="600" fill="url(#gcSky)" />

  <!-- Soho Shophouse Arcade Boulevard (Left Side) -->
  <g transform="translate(40, 200)">
    <!-- 4-Story Luxury Commercial Shophouses -->
    <rect x="0" y="0" width="220" height="260" fill="#2C3A47" rx="3" />
    <!-- Foster + Partners Architectural Louvers -->
    <g fill="#D49B42">
      <rect x="15" y="20" width="40" height="45" rx="2" />
      <rect x="70" y="20" width="40" height="45" rx="2" />
      <rect x="125" y="20" width="40" height="45" rx="2" />
      <rect x="15" y="80" width="40" height="45" rx="2" />
      <rect x="70" y="80" width="40" height="45" rx="2" />
      <rect x="125" y="80" width="40" height="45" rx="2" />
    </g>
    <!-- Ground Floor Boutique Storefronts with Warm Golden Glow -->
    <rect x="10" y="160" width="200" height="90" fill="#FFE59E" rx="3" />
    <rect x="25" y="175" width="45" height="65" fill="#0A192F" rx="2" />
    <rect x="85" y="175" width="45" height="65" fill="#0A192F" rx="2" />
    <rect x="145" y="175" width="45" height="65" fill="#0A192F" rx="2" />
  </g>

  <!-- Soho Shophouse Arcade Boulevard (Right Side) -->
  <g transform="translate(540, 200)">
    <rect x="0" y="0" width="220" height="260" fill="#2C3A47" rx="3" />
    <g fill="#D49B42">
      <rect x="55" y="20" width="40" height="45" rx="2" />
      <rect x="110" y="20" width="40" height="45" rx="2" />
      <rect x="165" y="20" width="40" height="45" rx="2" />
      <rect x="55" y="80" width="40" height="45" rx="2" />
      <rect x="110" y="80" width="40" height="45" rx="2" />
      <rect x="165" y="80" width="40" height="45" rx="2" />
    </g>
    <!-- Ground Floor Storefronts -->
    <rect x="10" y="160" width="200" height="90" fill="#FFE59E" rx="3" />
  </g>

  <!-- Central Grand Musical Water Canal -->
  <polygon points="260,340 540,340 680,600 120,600" fill="url(#canalWater)" />
  <!-- Canal Stone Embankment -->
  <polygon points="230,340 260,340 120,600 90,600" fill="#4B6584" />
  <polygon points="540,340 570,340 710,600 680,600" fill="#4B6584" />

  <!-- Spectacular Musical Fountains Laser & Water Jets -->
  <g filter="url(#fountainGlow)">
    <!-- Central High Jet -->
    <polygon points="395,490 405,490 402,140 398,140" fill="url(#fountainLight)" />
    <!-- Wing Arcs Left -->
    <path d="M400 480 Q320 280 280 390" stroke="url(#fountainLight)" stroke-width="6" fill="none" opacity="0.9" />
    <path d="M400 510 Q290 320 230 430" stroke="#FF85C0" stroke-width="4" fill="none" opacity="0.8" />
    <!-- Wing Arcs Right -->
    <path d="M400 480 Q480 280 520 390" stroke="url(#fountainLight)" stroke-width="6" fill="none" opacity="0.9" />
    <path d="M400 510 Q510 320 570 430" stroke="#FF85C0" stroke-width="4" fill="none" opacity="0.8" />
    <!-- Laser Rays Upwards -->
    <line x1="400" y1="460" x2="310" y2="80" stroke="#69C0FF" stroke-width="3" opacity="0.75" />
    <line x1="400" y1="460" x2="490" y2="80" stroke="#FFD666" stroke-width="3" opacity="0.75" />
  </g>

  <!-- Water Surface Reflections of the Show -->
  <ellipse cx="400" cy="520" rx="120" ry="25" fill="#85A5FF" opacity="0.5" filter="url(#fountainGlow)" />
  <ellipse cx="400" cy="540" rx="90" ry="18" fill="#FF85C0" opacity="0.4" filter="url(#fountainGlow)" />

  <!-- Badge -->
  <rect x="30" y="30" width="180" height="28" rx="6" fill="#0A192F" fill-opacity="0.85" stroke="#D49B42" stroke-width="1.5" />
  <text x="120" y="49" fill="#FFE8A3" font-size="12" font-family="Inter, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="1">THE GLOBAL CITY</text>
</svg>
